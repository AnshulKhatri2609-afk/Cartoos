<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CARToos Billing</title>
<style>
:root{--bg:#f6f7f4;--surf:#fff;--ink:#16302b;--mute:#5d716c;--line:#d9e0dc;--acc:#e8a317;--acc-ink:#2a1e00;--ok:#1f7a5c;--bad:#b3392f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b18;--surf:#17272300;--surf:#172723;--ink:#e8f0ed;--mute:#93a8a2;--line:#2b403a;--acc:#f0b43a;--acc-ink:#2a1e00;--ok:#4cc19a;--bad:#ef7d72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1b18;--surf:#172723;--ink:#e8f0ed;--mute:#93a8a2;--line:#2b403a;--acc:#f0b43a;--acc-ink:#2a1e00;--ok:#4cc19a;--bad:#ef7d72;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
header h1{margin:0;font:800 22px/1 "Arial Black","Trebuchet MS",sans-serif;letter-spacing:.5px}
header h1 span{color:var(--acc)}
nav{display:flex;gap:4px}
nav button{background:transparent;color:inherit;border:0;padding:8px 12px;border-radius:8px;font:inherit;font-size:14px;opacity:.7}
nav button[aria-selected=true]{background:var(--acc);color:var(--acc-ink);opacity:1;font-weight:700}
main{max-width:720px;margin:0 auto;padding:14px}
section{display:none}section.on{display:block}
h2{font-size:15px;margin:18px 0 8px;color:var(--mute);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.item{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left;color:var(--ink);font:inherit;min-height:74px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.item b{font-weight:600;font-size:14px}
.item i{font-style:normal;color:var(--mute);font-size:13px}
.item .n{position:absolute;top:-6px;right:-6px;background:var(--acc);color:var(--acc-ink);border-radius:99px;min-width:24px;height:24px;font-size:13px;font-weight:800;display:grid;place-items:center;padding:0 6px}
.cart{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:6px 12px}
.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .nm{flex:1;font-size:15px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px}
.amt{min-width:70px;text-align:right;font-variant-numeric:tabular-nums}
.tot{display:flex;justify-content:space-between;font-size:22px;font-weight:800;padding:12px 2px 4px}
.empty{color:var(--mute);padding:16px 0;text-align:center;font-size:14px}
.pay{display:flex;gap:6px;margin:10px 0}
.pay button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;font-size:14px}
.pay button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cta{width:100%;padding:15px;border:0;border-radius:12px;background:var(--acc);color:var(--acc-ink);font:800 17px inherit;font-family:inherit;margin-top:6px}
.cta:disabled{opacity:.4}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);padding:9px 12px;border-radius:8px;font:inherit;font-size:14px}
.ghost.del{color:var(--bad)}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surf);color:var(--ink);font:inherit;font-size:16px}
.two{display:grid;grid-template-columns:1fr 110px;gap:8px}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--ink);font-size:15px}
.chk input{width:20px;height:20px}
.hint{font-size:13px;color:var(--mute);margin:6px 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
/* receipt */
#receipt{display:none}
.rc{font:12px/1.35 "Courier New",monospace;color:#000;background:#fff;margin:0 auto;padding:4mm 2mm}
.rc .c{text-align:center}.rc .big{font:900 20px/1.1 "Arial Black",sans-serif}.rc .b{font-weight:700}
.rc hr{border:0;border-top:1px dashed #000;margin:5px 0}
.rc .r{display:flex;justify-content:space-between;gap:6px}
.rc .it{display:flex;gap:4px}.rc .it .nm{flex:1;word-break:break-word}.rc .it .q{width:22px;text-align:right}.rc .it .a{width:58px;text-align:right}
.rc .t{font-size:16px;font-weight:900}
@media print{
 @page{margin:0}
 body{background:#fff}
 body::before,header,main,#toast{display:none!important}
 #receipt{display:block}
}
</style>
</head>
<body>
<header>
  <h1>CAR<span>T</span>oos</h1>
  <nav role="tablist">
    <button role="tab" data-t="bill" aria-selected="true">Bill</button>
    <button role="tab" data-t="menu" aria-selected="false">Menu</button>
    <button role="tab" data-t="set" aria-selected="false">Setup</button>
  </nav>
</header>
<main>
<section id="bill" class="on">
  <h2>Tap items to add</h2>
  <div class="grid" id="items"></div>
  <h2>Current bill</h2>
  <div class="cart" id="cart"></div>
  <div class="pay" id="pay"></div>
  <button class="cta" id="print">Print receipt</button>
  <button class="cta" id="btprint" style="background:var(--ink);color:var(--bg)">Print via Bluetooth</button>
  <button class="ghost" id="clear" style="width:100%;margin-top:8px">Clear bill</button>
  <p class="hint">Next bill number: <b id="bn"></b></p>
</section>

<section id="menu">
  <h2>Add a menu item</h2>
  <div class="two"><input id="mn" placeholder="Item name"><input id="mp" type="number" inputmode="decimal" placeholder="Price"></div>
  <button class="cta" id="madd" style="margin-top:8px">Add item</button>
  <h2>Your menu</h2>
  <div class="cart" id="mlist"></div>
</section>

<section id="set">
  <label>Logo (optional, black and white prints best)</label>
  <input type="file" id="s_logo" accept="image/*">
  <img id="logo_prev" alt="Logo preview" style="display:none;max-width:200px;margin:8px 0;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px">
  <button class="ghost del" id="logo_rm" type="button">Remove logo</button>
  <label>Shop name</label><input id="s_name">
  <label>Address (optional)</label><textarea id="s_addr" rows="2"></textarea>
  <label>Receipt heading</label><input id="s_title">
  <div class="two"><div><label>Phone</label><input id="s_phone"></div><div><label>Paper</label><select id="s_w"><option value="58">58 mm</option><option value="80">80 mm</option></select></div></div>
  <label>Email</label><input id="s_email">
  <label>Footer message</label><input id="s_foot">
  <label class="chk" style="margin-top:14px"><input type="checkbox" id="s_gst"> My shop is GST registered</label>
  <div id="gstbox" style="display:none">
    <label>GSTIN</label><input id="s_gstin">
    <div class="two"><div><label>Tax mode</label><select id="s_inc"><option value="1">Prices include GST</option><option value="0">Add GST on top</option></select></div><div><label>GST %</label><input id="s_rate" type="number" inputmode="decimal"></div></div>
  </div>
  <label>Next bill number</label><input id="s_bill" type="number" inputmode="numeric">
  <p class="hint">Settings save automatically on this device. To print on a Bluetooth thermal printer from your phone, install your printer’s companion app (or RawBT on Android) and choose it as the print service.</p>
</section>
</main>
<div id="toast"></div>
<div id="receipt"></div>

<script>
var KEY="cartoos_v1";
var S={biz:{name:"CARToos",addr:"",title:"CARTOOS FOOD RECEIPT",phone:"7300000172",email:"contact@cartoos.co.in",foot:"Thank you for visiting CARToos! Please visit again.",gstin:""},
 gst:false,inc:true,rate:5,w:58,bill:1,
 menu:[{n:"Pahadi Hara Angaar Tikka",p:300},{n:"Veg Momos",p:120},{n:"Paneer Roll",p:140},{n:"Aloo Tikki Burger",p:90},{n:"Masala Chai",p:30},{n:"Cold Coffee",p:100}]};
try{var raw=localStorage.getItem(KEY);if(raw){var d=JSON.parse(raw);for(var k in d)S[k]=d[k];}}catch(e){}
var cart={},pay="Cash";
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function f(n){return Number(n).toFixed(2)}
function toast(m){var t=$("toast");t.textContent=m;t.className="on";setTimeout(function(){t.className=""},1800)}

document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){
 document.querySelectorAll("nav button").forEach(function(x){x.setAttribute("aria-selected",x===b)});
 document.querySelectorAll("section").forEach(function(s){s.className=s.id===b.dataset.t?"on":""});
}});

function totals(){
 var sum=0;S.menu.forEach(function(m,i){if(cart[i])sum+=m.p*cart[i]});
 var sub=sum,tax=0,tot=sum;
 if(S.gst&&S.rate>0){
  if(S.inc){sub=sum/(1+S.rate/100);tax=sum-sub}else{tax=sum*S.rate/100;tot=sum+tax}
 }
 return{sub:sub,tax:tax,tot:tot,any:sum>0};
}
function renderBill(){
 $("items").innerHTML=S.menu.map(function(m,i){
  return '<button class="item" data-i="'+i+'"><b>'+esc(m.n)+'</b><i>₹'+f(m.p)+'</i>'+(cart[i]?'<span class="n">'+cart[i]+'</span>':'')+'</button>'}).join("");
 document.querySelectorAll(".item").forEach(function(b){b.onclick=function(){var i=b.dataset.i;cart[i]=(cart[i]||0)+1;renderBill()}});
 var rows="";S.menu.forEach(function(m,i){if(cart[i])rows+='<div class="row"><span class="nm">'+esc(m.n)+'</span><span class="qty"><button data-m="'+i+'" aria-label="Remove one">−</button><b>'+cart[i]+'</b><button data-p="'+i+'" aria-label="Add one">+</button></span><span class="amt">'+f(m.p*cart[i])+'</span></div>'});
 var t=totals();
 if(!t.any){$("cart").innerHTML='<div class="empty">No items yet. Tap an item above to start a bill.</div>'}
 else{
  var extra="";
  if(S.gst&&t.tax>0)extra='<div class="row"><span class="nm" style="color:var(--mute)">GST '+S.rate+'% '+(S.inc?"(included)":"(added)")+'</span><span class="amt">'+f(t.tax)+'</span></div>';
  $("cart").innerHTML=rows+extra+'<div class="tot"><span>Total</span><span>₹'+f(t.tot)+'</span></div>';
 }
 document.querySelectorAll("[data-m]").forEach(function(b){b.onclick=function(){var i=b.dataset.m;cart[i]--;if(cart[i]<=0)delete cart[i];renderBill()}});
 document.querySelectorAll("[data-p]").forEach(function(b){b.onclick=function(){cart[b.dataset.p]++;renderBill()}});
 $("print").disabled=!t.any;
 $("bn").textContent=String(S.bill).padStart(4,"0");
}
$("pay").innerHTML=["Cash","UPI","Card"].map(function(p){return '<button data-pay="'+p+'" aria-pressed="'+(p===pay)+'">'+p+'</button>'}).join("");
document.querySelectorAll("[data-pay]").forEach(function(b){b.onclick=function(){pay=b.dataset.pay;document.querySelectorAll("[data-pay]").forEach(function(x){x.setAttribute("aria-pressed",x===b)})}});
$("clear").onclick=function(){cart={};renderBill()};

function buildReceipt(){
 var t=totals(),B=S.biz,now=new Date();
 var dt=now.toLocaleDateString("en-GB").replace(/\//g,"-"),tm=now.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});
 var h='<div class="rc" style="width:'+S.w+'mm">';
 if(S.logo)h+='<div class="c"><img src="'+S.logo+'" style="max-width:60%" alt=""></div>';else h+='<div class="c big">'+esc(B.name)+'</div>';
 if(B.addr)h+='<div class="c">'+esc(B.addr).replace(/\n/g,"<br>")+'</div>';
 if(S.gst&&B.gstin)h+='<div class="c">GSTIN: '+esc(B.gstin)+'</div>';
 h+='<hr><div class="c b">'+esc(B.title)+'</div><hr>';
 h+='<div class="r"><span>Bill No: '+String(S.bill).padStart(4,"0")+'</span><span>'+dt+'</span></div><div class="r"><span>Paid by: '+pay+'</span><span>'+tm+'</span></div><hr>';
 h+='<div class="it b"><span class="nm">Item</span><span class="q">Qty</span><span class="a">Amt</span></div>';
 var n=0;
 S.menu.forEach(function(m,i){if(cart[i]){n+=cart[i];h+='<div class="it"><span class="nm">'+esc(m.n)+'<br>@ '+f(m.p)+'</span><span class="q">'+cart[i]+'</span><span class="a">'+f(m.p*cart[i])+'</span></div>'}});
 h+='<hr>';
 if(S.gst&&t.tax>0){
  h+='<div class="r"><span>Subtotal</span><span>'+f(t.sub)+'</span></div>';
  h+='<div class="r"><span>CGST '+(S.rate/2)+'%</span><span>'+f(t.tax/2)+'</span></div>';
  h+='<div class="r"><span>SGST '+(S.rate/2)+'%</span><span>'+f(t.tax/2)+'</span></div><hr>';
 }
 h+='<div class="r t"><span>TOTAL</span><span>INR '+f(t.tot)+'</span></div><div>Items: '+n+'</div><hr>';
 h+='<div class="c">'+esc(B.foot)+'</div><br>';
 if(B.phone)h+='<div class="c">Ph: '+esc(B.phone)+'</div>';
 if(B.email)h+='<div class="c">'+esc(B.email)+'</div>';
 h+='<br><br></div>';
 $("receipt").innerHTML=h;
}
$("print").onclick=function(){
 buildReceipt();
 try{window.print()}catch(e){toast("Printing isn’t available here")}
 S.bill++;save();cart={};renderBill();
};

function bw(img,w,mh){mh=mh||180;var h=Math.round(img.height*w/img.width);if(h>mh){h=mh;w=img.width*mh/img.height}w=Math.max(8,Math.floor(w/8)*8);var c=document.createElement("canvas");c.width=w;c.height=h;var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);var d=x.getImageData(0,0,w,h),p=d.data;for(var i=0;i<p.length;i+=4){var g=p[i]*.3+p[i+1]*.59+p[i+2]*.11,v=g<150?0:255;p[i]=p[i+1]=p[i+2]=v;p[i+3]=255}x.putImageData(d,0,0);return c}
function logoPrev(){var im=$("logo_prev");if(S.logo){im.src=S.logo;im.style.display="block"}else im.style.display="none"}
$("s_logo").onchange=function(){var fl=this.files[0];if(!fl)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){S.logo=bw(im,384).toDataURL("image/png");save();logoPrev();toast("Logo saved")};im.onerror=function(){toast("Could not read that image")};im.src=r.result};r.readAsDataURL(fl)};
$("logo_rm").onclick=function(){S.logo="";save();logoPrev();$("s_logo").value=""};
logoPrev();
function logoRaster(){return new Promise(function(res){var im=new Image();im.onerror=function(){res(null)};im.onload=function(){var c=bw(im,S.w==80?288:192,120),w=c.width,h=c.height,d=c.getContext("2d").getImageData(0,0,w,h).data,wb=w/8,o=[29,118,48,0,wb&255,wb>>8,h&255,h>>8];for(var y=0;y<h;y++)for(var xb=0;xb<wb;xb++){var by=0;for(var b=0;b<8;b++){if(d[(y*w+xb*8+b)*4]<128)by|=128>>b}o.push(by)}res(o)};im.src=S.logo})}
var BTC=null;
function two(l,r,w){var sp=w-l.length-r.length;if(sp<1){l=l.slice(0,Math.max(0,w-r.length-1));sp=w-l.length-r.length}return l+" ".repeat(sp)+r}
function wrap(s,w){var o=[];while(s.length>w){o.push(s.slice(0,w));s=s.slice(w)}o.push(s);return o}
function escBytes(lg){
 var W=S.w==80?48:32,t=totals(),B=S.biz,now=new Date(),out=[];
 var dt=now.toLocaleDateString("en-GB").replace(/\//g,"-"),tm=now.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});
 function raw(){for(var i=0;i<arguments.length;i++)out.push(arguments[i])}
 function tx(s){for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);out.push(c<128?c:63)}out.push(10)}
 var dash=Array(W+1).join("-");
 raw(27,64,27,97,1);
 if(lg){for(var q=0;q<lg.length;q++)out.push(lg[q]);out.push(10)}else{raw(27,69,1,29,33,17);tx(B.name);raw(29,33,0,27,69,0)}
 if(B.addr)B.addr.split("\n").forEach(function(l){wrap(l,W).forEach(tx)});
 if(S.gst&&B.gstin)tx("GSTIN: "+B.gstin);
 raw(27,97,0);tx(dash);raw(27,97,1,27,69,1);tx(B.title);raw(27,69,0,27,97,0);tx(dash);
 tx(two("Bill No: "+String(S.bill).padStart(4,"0"),dt,W));tx(two("Paid by: "+pay,tm,W));tx(dash);
 S.menu.forEach(function(m,i){if(cart[i]){wrap(m.n,W).forEach(tx);tx(two("  "+cart[i]+" x "+f(m.p),f(m.p*cart[i]),W))}});
 tx(dash);
 if(S.gst&&t.tax>0){tx(two("Subtotal",f(t.sub),W));tx(two("CGST "+(S.rate/2)+"%",f(t.tax/2),W));tx(two("SGST "+(S.rate/2)+"%",f(t.tax/2),W));tx(dash)}
 raw(27,69,1,29,33,16);tx(two("TOTAL","INR "+f(t.tot),W>>1));raw(29,33,0,27,69,0);tx(dash);
 raw(27,97,1);wrap(B.foot,W).forEach(tx);if(B.phone)tx("Ph: "+B.phone);if(B.email)tx(B.email);
 raw(10,10,10,29,86,66,0);
 return out;
}
async function btPrint(){
 if(!navigator.bluetooth){toast("Bluetooth not supported here. Open in Bluefy browser.");return}
 if(!totals().any)return;
 try{
  if(!BTC){
   var d=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[0x18f0,"000018f0-0000-1000-8000-00805f9b34fb","e7810a71-73ae-499d-8c15-faa9aef0c3f2","49535343-fe7d-4ae5-8fa9-9fafd205e455","0000ff00-0000-1000-8000-00805f9b34fb","0000fee7-0000-1000-8000-00805f9b34fb"]});
   var srv=await d.gatt.connect(),ss=await srv.getPrimaryServices();
   for(var a=0;a<ss.length&&!BTC;a++){var cs=await ss[a].getCharacteristics();for(var b=0;b<cs.length;b++){if(cs[b].properties.writeWithoutResponse||cs[b].properties.write){BTC=cs[b];break}}}
   if(!BTC){toast("No printable channel found on this device");return}
   d.addEventListener("gattserverdisconnected",function(){BTC=null});
  }
  var lg=S.logo?await logoRaster():null;var data=new Uint8Array(escBytes(lg));
  for(var i=0;i<data.length;i+=20){
   var ch=data.slice(i,i+20);
   if(BTC.properties.writeWithoutResponse&&BTC.writeValueWithoutResponse)await BTC.writeValueWithoutResponse(ch);else await BTC.writeValue(ch);
   await new Promise(function(r){setTimeout(r,15)});
  }
  S.bill++;save();cart={};renderBill();toast("Sent to printer");
 }catch(e){toast("Printer: "+(e.message||e))}
}
$("btprint").onclick=btPrint;
function renderMenu(){
 $("mlist").innerHTML=S.menu.length?S.menu.map(function(m,i){return '<div class="row"><span class="nm">'+esc(m.n)+'</span><span class="amt">₹'+f(m.p)+'</span><button class="ghost del" data-d="'+i+'">Remove</button></div>'}).join(""):'<div class="empty">Your menu is empty. Add an item above.</div>';
 document.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){S.menu.splice(+b.dataset.d,1);cart={};save();renderMenu();renderBill()}});
}
$("madd").onclick=function(){
 var n=$("mn").value.trim(),p=parseFloat($("mp").value);
 if(!n||!(p>=0)){toast("Enter a name and a price");return}
 S.menu.push({n:n,p:p});$("mn").value="";$("mp").value="";save();renderMenu();renderBill();toast("Item added");
};

var map={s_name:"name",s_addr:"addr",s_title:"title",s_phone:"phone",s_email:"email",s_foot:"foot",s_gstin:"gstin"};
Object.keys(map).forEach(function(id){var el=$(id);el.value=S.biz[map[id]]||"";el.oninput=function(){S.biz[map[id]]=el.value;save()}});
$("s_w").value=String(S.w);$("s_w").onchange=function(){S.w=+this.value;save()};
$("s_gst").checked=S.gst;$("gstbox").style.display=S.gst?"block":"none";
$("s_gst").onchange=function(){S.gst=this.checked;$("gstbox").style.display=S.gst?"block":"none";save();renderBill()};
$("s_inc").value=S.inc?"1":"0";$("s_inc").onchange=function(){S.inc=this.value==="1";save();renderBill()};
$("s_rate").value=S.rate;$("s_rate").oninput=function(){S.rate=parseFloat(this.value)||0;save();renderBill()};
$("s_bill").value=S.bill;$("s_bill").oninput=function(){S.bill=parseInt(this.value)||1;save();renderBill()};
document.querySelectorAll("nav button").forEach(function(b){b.addEventListener("click",function(){$("s_bill").value=S.bill})});
renderBill();renderMenu();
</script>
</body>
</html>
